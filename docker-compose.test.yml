services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: peershare_test
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peershare_test"]
      interval: 2s
      timeout: 3s
      retries: 20
