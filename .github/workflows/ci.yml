name: CI

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'docker-compose.test.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'tests/**'
      - 'playwright.config.js'
      - 'docker-compose.test.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  changed-files:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            server:
              - 'server/**'

  client-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm --prefix client run lint
      - run: npm --prefix client run test:unit
      - run: npm --prefix client run build

  server-checks:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/peershare_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: peershare_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d peershare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - name: Apply test database migrations
        run: npm --prefix server run test:db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm --prefix server run test:unit
      - run: npm --prefix server run test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/peershare_test?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: peershare_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d peershare_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Create ephemeral test-only values
        run: |
          echo "E2E_TEST_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix server
      - name: Apply test database migrations
        run: npm --prefix server run test:db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Seed isolated browser-test accounts
        run: npm --prefix server run test:e2e:seed
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real-browser end-to-end tests
        run: npm run test:e2e
        env:
          CI: true
          CLIENT_URL: http://127.0.0.1:5173
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Remove browser-test accounts
        if: always()
        run: npm --prefix server run test:e2e:clean
      - name: Upload raw Playwright output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            playwright-report/
            test-results/
            playwright-logs/
          if-no-files-found: warn
          retention-days: 14

  test-reports:
    if: always()
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Download Playwright reports and diagnostics
        uses: actions/download-artifact@v4
        with:
          name: e2e-output
          path: playwright-output
      - name: Publish retained test reports
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-and-diagnostics
          path: playwright-output/
          if-no-files-found: warn
          retention-days: 14

  deploy-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changed-files.outputs.server == 'true'
    needs: [changed-files, client-checks, server-checks, e2e-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
